name: Package and Release Skill

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'skills/**'
      - '.github/package-skill.py'
      - '.github/tests/**'
      - '.github/workflows/release.yml'
      - '.gitattributes'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Offline Wrapper Boundary
        run: |
          bash -n skills/linux-kernel-crash-debug/scripts/agent-crash.sh
          python3 .github/tests/test_agent_crash.py

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify Skills CLI Installation
        env:
          # Only an explicit catalog publication should report this test install.
          DISABLE_TELEMETRY: ${{ !contains(github.event.head_commit.message, '[skills.sh]') && '1' || '' }}
        run: |
          set -euo pipefail
          skill_name=linux-kernel-crash-debug
          skill_source="$GITHUB_WORKSPACE/skills/$skill_name"
          install_project="$(mktemp -d)"
          cd "$install_project"
          git init -q
          npx --yes skills@1.9.0 add "$GITHUB_REPOSITORY@$GITHUB_SHA" \
            --skill "$skill_name" -a codex -a claude-code -a antigravity-cli --copy -y
          diff -r "$skill_source" ".agents/skills/$skill_name"
          diff -r "$skill_source" ".claude/skills/$skill_name"

      - name: Create Skill Packages
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 .github/package-skill.py . --tag "$GITHUB_REF_NAME"
          else
            python3 .github/package-skill.py .
          fi

      - name: Verify Release Archives and Source Export
        run: |
          set -euo pipefail
          archive=(linux-kernel-crash-debug-v*.zip)
          test "${#archive[@]}" -eq 1
          unzip -tq linux-kernel-crash-debug.skill
          unzip -tq "${archive[0]}"
          package_root="$(mktemp -d)"
          unzip -q linux-kernel-crash-debug.skill -d "$package_root/skill"
          unzip -q "${archive[0]}" -d "$package_root/zip"
          diff -r "$package_root/skill" "$package_root/zip/${archive[0]%.zip}"

          # Keep this forbidden-path expression aligned with .gitattributes.
          git archive --format=zip --prefix=source/ -o "$package_root/source.zip" HEAD
          forbidden='\.gitignore$|\.gitattributes$|\.github/|\.agents/|\.firecrawl/|^[^/]*/LICENSE$|^[^/]*/CONTRIBUTING\.md$|^[^/]*/CHANGELOG\.md$|^[^/]*/CLAUDE\.md$|^[^/]*/AGENTS\.md$|^[^/]*/README\.md$|^[^/]*/README_CN\.md$'
          if unzip -Z1 "$package_root/source.zip" | rg "$forbidden"; then
            exit 1
          fi
          diff -u <(git ls-files 'skills/linux-kernel-crash-debug/**' | sort) \
            <(unzip -Z1 "$package_root/source.zip" | sed -e 's,^source/,,' -e '/\/$/d' -e '/^$/d' | sort)

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: skill-release
          path: |
            linux-kernel-crash-debug.skill
            linux-kernel-crash-debug-v*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skill-release
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            linux-kernel-crash-debug.skill
            linux-kernel-crash-debug-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
